name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install "PyYAML>=6,<7"

      - name: Validate skills and Python syntax
        run: python scripts/validate_repo.py

      - name: Test safe directory submission
        run: python -m unittest discover -s seo-backlink-submitter/tests -p "test_*.py" -v

      - name: Test code-page generator and examples
        run: python -m unittest discover -s multi-game-codes-hub/tests -p "test_*.py" -v

      - name: Test Roblox site pipeline contracts
        run: python -m unittest discover -s roblox-site-architect/tests -p "test_*.py" -v
