name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --prune --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install test dependencies
        run: |
          python3 --version
          python3 -m pip install "PyYAML>=6,<7" "requests>=2,<3"

      - name: Validate skills and Python syntax
        run: python3 scripts/validate_repo.py

      - name: Check generated skill catalog
        run: python3 scripts/generate_catalog.py --check

      - name: Test skill catalog
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Test safe directory submission
        run: python3 -m unittest discover -s seo-backlink-submitter/tests -p "test_*.py" -v

      - name: Test code-page generator and examples
        run: python3 -m unittest discover -s multi-game-codes-hub/tests -p "test_*.py" -v

      - name: Test Roblox site pipeline contracts
        run: python3 -m unittest discover -s roblox-site-architect/tests -p "test_*.py" -v

      - name: Test Roblox hit evaluator
        run: python3 -m unittest discover -s roblox-hit-evaluator/tests -p "test_*.py" -v

      - name: Test SignalLayer client
        run: python3 -m unittest discover -s signallayer-backlinks-client/tests -p "test_*.py" -v

      - name: Test HTML5 Reddit monitor safety
        run: python3 -m unittest discover -s html5-game-radar/tests -p "test_*.py" -v

      - name: Test SEO link strategy safety
        run: python3 -m unittest discover -s seo-link-strategy/tests -p "test_*.py" -v
